name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: GitHub package hygiene
        run: npm run github:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            process/continuum/pyproject.toml
            process/continuum-adk/pyproject.toml
            process/continuum-adk/constraints/tested-py312.txt
            process/continuum-maf/pyproject.toml
            process/continuum-maf/constraints/tested-py312.txt
      - name: Install Process test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./process/continuum
          python -m pip install -e './process/continuum-adk[test]' -c process/continuum-adk/constraints/tested-py312.txt
          python -m pip install -e './process/continuum-maf[test]' -c process/continuum-maf/constraints/tested-py312.txt
      - name: Verify Super Bundle
        run: npm run verify
