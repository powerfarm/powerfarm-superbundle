[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-maf"
version = "0.1.0"
description = "PowerFarm institutional admission boundary for Microsoft Agent Framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core>=1.16,<2",
  "powerfarm-continuum>=0.4.0,<0.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
continuum_maf = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
